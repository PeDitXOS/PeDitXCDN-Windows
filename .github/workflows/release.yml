---
name: Windows Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PeDitXCDN ${{ github.ref_name }}'
          releaseBody: 'Windows installer (NSIS + MSI)'
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis,msi'

      # Sign executables with self-signed certificate (if secret exists)
      - name: Sign executables
        if: ${{ secrets.CERTIFICATE_BASE64 != '' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          # Decode certificate
          $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          $certPath = "$env:TEMP\certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Find all exe files in the build output
          $exeFiles = Get-ChildItem -Path "src-tauri\target\release\bundle" -Recurse -Filter "*.exe"
          foreach ($exe in $exeFiles) {
            Write-Host "Signing: $($exe.FullName)"
            & signtool sign /f $certPath /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
          }

          # Clean up
          Remove-Item $certPath -Force
          Write-Host "Signing complete!"

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
