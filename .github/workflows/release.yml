---
name: Windows Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install NSIS (for custom installer)
        run: choco install nsis -y

      - name: Install dependencies
        run: npm ci


      # sing-box sidecar: bundled next to PeDitXCDN.exe so tunnel::binary_path()
      # finds it. Pinned by SHA256 — an unpinned download is a supply-chain hole
      # on a binary that sees every packet of the games it routes.
      - name: Fetch sing-box sidecar
        shell: pwsh
        env:
          SING_BOX_VERSION: '1.14.2'
          SING_BOX_ZIP_SHA256: 'c2d8bfff918755808781dfdeeb8581b6c91eb3a243d9a7b55483cfc0c0684d32'
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:SING_BOX_VERSION
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$v/sing-box-$v-windows-amd64.zip"
          $zip = "$env:RUNNER_TEMP\sing-box.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:SING_BOX_ZIP_SHA256) { throw "sing-box zip SHA256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\singbox" -Force
          $dir = Get-ChildItem "$env:RUNNER_TEMP\singbox" -Directory | Select-Object -First 1
          Copy-Item "$($dir.FullName)\sing-box.exe" src-tauri\sing-box.exe -Force
          Copy-Item "$($dir.FullName)\libcronet.dll" src-tauri\libcronet.dll -Force
          Write-Host "sing-box $v ready (verified $hash)"

      - name: Build frontend
        run: npm run build

      # Step 1: Decode certificate (skipped if secret not set)
      - name: Decode certificate
        if: env.HAS_CERT != ''
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          HAS_CERT: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", $certBytes)
          Write-Host "Certificate decoded"

      # Step 2: Build Tauri app
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY: not needed (no updater)
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PeDitXCDN ${{ github.ref_name }}'
          releaseBody: 'Windows installer with certificate auto-install'
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis'

      # Step 3: Sign the built EXE (skipped if secret not set)
      - name: Sign executables
        if: env.HAS_CERT != ''
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Continue'
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          # Find signtool from Windows SDK
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "WARN: signtool.exe not found, skipping signing" -ForegroundColor Yellow
            exit 0
          }
          $signtoolPath = $signtool.FullName
          Write-Host "Using signtool: $signtoolPath"
          $exeFiles = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          foreach ($exe in $exeFiles) {
            Write-Host "Signing: $($exe.Name)"
            & $signtoolPath sign /f $certPath /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  OK" -ForegroundColor Green
            } else {
              Write-Host "  WARN: signing failed, continuing unsigned" -ForegroundColor Yellow
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PeDitXCDN-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
