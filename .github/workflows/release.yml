---
name: Windows Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install NSIS (for custom installer)
        run: choco install nsis -y

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Step 1: Decode certificate (skipped if secret not set)
      - name: Decode certificate
        if: env.HAS_CERT != ''
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          HAS_CERT: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $certBytes = [Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", $certBytes)
          Write-Host "Certificate decoded"

      # Step 2: Build Tauri app
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY: not needed (no updater)
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PeDitXCDN ${{ github.ref_name }}'
          releaseBody: 'Windows installer with certificate auto-install'
          releaseDraft: false
          prerelease: false
          args: '--bundles nsis'

      # Step 3: Sign the built EXE (skipped if secret not set)
      - name: Sign executables
        if: env.HAS_CERT != ''
        shell: pwsh
        env:
          HAS_CERT: ${{ secrets.CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Continue'
          $certPath = "$env:RUNNER_TEMP\certificate.pfx"
          # Find signtool from Windows SDK
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool) {
            Write-Host "WARN: signtool.exe not found, skipping signing" -ForegroundColor Yellow
            exit 0
          }
          $signtoolPath = $signtool.FullName
          Write-Host "Using signtool: $signtoolPath"
          $exeFiles = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
          foreach ($exe in $exeFiles) {
            Write-Host "Signing: $($exe.Name)"
            & $signtoolPath sign /f $certPath /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe.FullName 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  OK" -ForegroundColor Green
            } else {
              Write-Host "  WARN: signing failed, continuing unsigned" -ForegroundColor Yellow
            }
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PeDitXCDN-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
