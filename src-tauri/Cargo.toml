[package]
name = "peditx-cdn-client"
version = "0.3.14"
edition = "2021"
description = "PeDitXCDN Windows DNS Client"
authors = ["PeDitXOS"]
license = "MIT"
repository = "https://github.com/PeDitXOS/PeDitXCDN-Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
dirs = "5"
urlencoding = "2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
